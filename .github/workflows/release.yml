name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Verify tag matches pyproject version
        run: |
          PYPROJECT_VERSION="$(grep -E '^version *= *' pyproject.toml | head -1 | sed -E 's/^version *= *"([^"]+)".*/\1/')"
          TAG="${GITHUB_REF_NAME#v}"
          echo "pyproject version: $PYPROJECT_VERSION"
          echo "release tag:       $TAG"
          if [ "$PYPROJECT_VERSION" != "$TAG" ]; then
            echo "::error::Tag ($TAG) does not match pyproject.toml version ($PYPROJECT_VERSION)" >&2
            exit 1
          fi

      - name: Build sdist + wheel
        run: uv build

      - name: Show distributions
        run: ls -lh dist/

      - name: Upload distributions artifact
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/eirmos
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  attach-to-release:
    name: Attach distributions to GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
