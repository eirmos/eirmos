[project]
name = "eirmos"
version = "0.6.0"
description = "eirmos — explore the mental graph of your CI/CD pipelines. Parse and visualise pipeline dependencies across 13 systems (GitLab CI, GitHub Actions, Jenkins, CircleCI, Azure Pipelines, Bitbucket, Drone/Woodpecker, Travis, AppVeyor, Buildkite, Codefresh, Semaphore)."
readme = "README.md"
authors = [
    { name = "fokion", email = "mail@fokion.online" },
]
keywords = ["ci", "cd", "pipeline", "visualisation", "mermaid", "graph", "gitlab", "github-actions", "jenkins", "circleci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Software Distribution",
]
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://eirmos.dev"
Changelog = "https://eirmos.dev/changelog"

[project.optional-dependencies]
dev = [
    "coverage>=7.0",
    "shiv>=1.0",
    "build>=1.0",
]

[project.scripts]
eirmos = "eirmos.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eirmos*"]
exclude = ["tests*"]
