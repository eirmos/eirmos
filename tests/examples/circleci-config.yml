version: 2.1
jobs:
  build:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
  test:
    docker:
      - image: cimg/base:stable
    steps:
      - run: echo test
  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - run: echo deploy
workflows:
  version: 2
  ci:
    jobs:
      - build
      - test:
          requires: [build]
      - deploy:
          requires: [test]
